name: dukanedge
description: DukanEdge - Offline Retail & Wholesale ERP for household, kitchenware, gift and plastic item shops.
publish_to: 'none'
version: 1.0.0+2002

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database (100% offline)
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Auth: PIN storage + Fingerprint/Biometric
  shared_preferences: ^2.2.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5

  # UI / Fonts / Icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  fl_chart: ^0.69.0
  shimmer: ^3.0.0

  # Barcode / QR generation and scanning
  barcode: ^2.2.6
  barcode_widget: ^2.0.4
  mobile_scanner: ^5.2.3

  # Invoice PDF generation and printing/sharing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Backup / Restore (zip the DB + images, share out, and pick a zip back in)
  archive: ^3.6.1
  share_plus: ^10.1.2
  file_picker: ^8.1.3
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0

  # Bluetooth thermal receipt printing
  blue_thermal_printer: ^1.2.3
  permission_handler: ^11.3.1

  # Local notifications (low stock / due payment reminders)
  flutter_local_notifications: ^18.0.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  url_launcher: ^6.3.0
  http: ^1.2.1
  package_info_plus: ^8.0.0
  sentry_flutter: ^8.0.0

  # AI / Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/adaptive_foreground.png
    - assets/icon/adaptive_background.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/static/Inter_18pt-Black.ttf
          weight: 900
